# 生产示例：本仓构建 + PostgreSQL + Redis
# 复制为仓库根目录 docker-compose.prod.yml 后改密码再启动：
#   cp docs/docker-compose.prod.example.yml docker-compose.prod.yml
#   # 编辑密码与 SESSION_SECRET
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tongyiapi-byok:prod
    container_name: tongyiapi-byok
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - SQL_DSN=postgresql://byok:CHANGE_ME_DB@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:CHANGE_ME_REDIS@redis:6379
      - SESSION_SECRET=CHANGE_ME_SESSION_SECRET
      # HTTPS 控制台时打开：
      # - SESSION_COOKIE_SECURE=true
      # - SESSION_COOKIE_TRUSTED_URL=https://www.example.com
      # - TRUSTED_PROXIES=172.16.0.0/12
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=tongyiapi-1
    depends_on:
      - postgres
      - redis
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "CHANGE_ME_REDIS"]

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: byok
      POSTGRES_PASSWORD: CHANGE_ME_DB
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
